name: Deploy API to Lightsail

# Waits for the CI workflow to finish on main and only deploys if it passed.
# Without this gate, a commit that fails tests/build could still reach
# production the moment it lands on main — CI passing on the PR doesn't
# guarantee CI passes again post-merge (e.g. a bad merge commit).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One deploy at a time. Every run works on the same ~/app checkout on the box:
# it resets the working tree, rebuilds dist/ in place and restarts the unit, so
# two overlapping runs can have one deleting dist/ while the other is restarting
# from it, or reset the checkout out from under a build. Queue them instead.
#
# NOT cancel-in-progress: a deploy that is halfway through is a build that has
# started or a migration that has run. Cancelling it mid-SSH leaves exactly the
# half-applied state this workflow is being changed to avoid; the second run
# waits and then deploys the newer commit over the top.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # Pinned to a commit SHA, not the mutable "v1" tag: this action
        # receives the production SSH private key, so if "v1" ever moved to a
        # different (compromised or malicious) commit upstream, it would run
        # with our credentials before anyone noticed. Pinning removes that
        # trust-on-every-run exposure. (v1.2.5, the latest release as of writing.)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -euo pipefail

            cd ~/app
            git fetch origin
            git checkout main
            # Pinned to the exact commit THIS workflow_run validated, not the
            # moving origin/main tip. Without this, a commit landing on main
            # between CI finishing and this job running would deploy
            # untested code — the gate above would have passed for nothing.
            git reset --hard ${{ github.event.workflow_run.head_sha }}

            cd server
            npm install --include=dev
            npx prisma generate

            # BUILD BEFORE MIGRATE, and build with esbuild rather than tsc.
            #
            # Both halves of that come from one deploy failing on 2026-09-20.
            # tsc peaks near 750 MB type-checking this project; this box caps
            # V8's old space near 460 MB, so it died with "heap out of memory".
            # Because migrate ran first, the database was left three migrations
            # ahead of the process still serving traffic, one of which had
            # dropped columns that process still read. See server/scripts/build.js
            # for why transpiling here is safe: CI type-checks every change with
            # tsc on a runner that has the memory for it.
            #
            # In this order a failed build changes nothing: the old code keeps
            # serving the schema it was written against, and the deploy simply
            # has not happened.
            npm run build:deploy
            npx prisma migrate deploy

            sudo systemctl restart cropbid-api

            # Confirm it's actually serving traffic, not just that systemd
            # marks it "active". A crash-loop right after restart would
            # otherwise pass silently.
            #
            # Asked about every 2 seconds until 60 seconds have passed, not once
            # after a fixed wait. The API does checks before it listens (the
            # payout encryption check reads Neon first, CLAUDE.md §12), so on
            # some boots it is not answering 3 seconds in: a single check then
            # failed deploys that had in fact succeeded (c88f37f on 2026-10-09,
            # ee001dc on 2026-10-22, 7718f93 on 2026-10-23). The limit is a
            # clock, not a count of tries, and each request may only use the
            # time left, so a health route that accepts connections and hangs
            # still ends the check at 60 seconds. The unit is checked on every
            # pass, so a crash still fails at once.
            #
            # A first 200 is not the end of it: a process that answers once and
            # then dies would pass. And the unit restarts itself (Restart=always,
            # RestartSec=3), so a crashed process can be replaced by one that
            # answers again before any later check, and "active and answering"
            # would then be true of a different process. So the restart counter
            # is read right after `restart` and the process id at the first 200,
            # and 5 seconds later the unit must be active, answering, on the same
            # process, with no automatic restart since the deploy restarted it.
            #
            # No `sudo` here at all: querying a system unit's status is a
            # read-only operation systemd allows any local user to run.
            # `restart` above is the only step that actually needs the
            # elevated NOPASSWD grant. Keeping that the ONLY thing in
            # sudoers means this script can grow without the sudoers file
            # needing to grow in lockstep with it. For the same reason the
            # journal is read without sudo, and skipped if this user cannot
            # read it, rather than widening sudoers.
            show_diagnostics() {
              echo "---- systemctl status cropbid-api ----" >&2
              systemctl status cropbid-api --no-pager >&2 || true
              echo "---- journalctl -u cropbid-api (last 50 lines) ----" >&2
              journalctl -u cropbid-api -n 50 --no-pager >&2 \
                || echo "(journal not readable without sudo, skipped)" >&2
            }

            unit_prop() { systemctl show cropbid-api -p "$1" --value; }
            restarts_before=$(unit_prop NRestarts)

            started=$(date +%s)
            deadline=$((started + 60))
            healthy=0
            while :; do
              sleep 2
              if ! systemctl is-active --quiet cropbid-api; then
                echo "cropbid-api is not running after restart" >&2
                show_diagnostics
                exit 1
              fi
              left=$((deadline - $(date +%s)))
              if [ "$left" -le 0 ]; then
                break
              fi
              wait_for=$(( left < 5 ? left : 5 ))
              if curl -sf --max-time "$wait_for" http://127.0.0.1:5000/api/health > /dev/null; then
                healthy=1
                break
              fi
            done
            elapsed=$(( $(date +%s) - started ))
            if [ "$healthy" -ne 1 ]; then
              echo "API did not answer /api/health within 60s (gave up after ${elapsed}s)" >&2
              show_diagnostics
              exit 1
            fi
            echo "API healthy after ${elapsed}s"
            pid_first=$(unit_prop MainPID)

            sleep 5
            if ! systemctl is-active --quiet cropbid-api \
              || ! curl -sf --max-time 5 http://127.0.0.1:5000/api/health > /dev/null \
              || [ "$(unit_prop MainPID)" != "$pid_first" ] \
              || [ "$(unit_prop NRestarts)" != "$restarts_before" ]; then
              echo "API answered once, then stopped or was restarted: likely a crash loop" >&2
              show_diagnostics
              exit 1
            fi
            echo "API still healthy 5s later"
